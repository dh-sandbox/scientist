# Qlty configuration for dh-sandbox/scientist
# Generated by setup-qlty-toml skill (2026-04-15)
#
# For a guide to configuration, visit https://qlty.sh/d/config
# For a full reference, visit https://qlty.sh/d/qlty-toml
config_version = "0"

exclude_patterns = [
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/.yarn/**",
  "**/*.d.ts",
  "**/bower_components/**",
  "**/build/**",
  "**/dist/**",
  "**/generated/**",
  "**/node_modules/**",
  "**/protos/**",
  "**/target/**",
  "**/vendor/**",
]

test_patterns = [
  "**/test/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

[smells]
mode = "comment"

[[source]]
name = "default"
default = true

# --- Security ---

[[plugin]]
name = "trufflehog"
mode = "block"

[[plugin]]
name = "zizmor"
mode = "block"

[[plugin]]
name = "trivy"
mode = "block"
drivers = [
  "config",
]

# --- Linters ---

[[plugin]]
name = "rubocop"
mode = "comment"

[[plugin]]
name = "reek"
mode = "comment"

[[plugin]]
name = "actionlint"
mode = "comment"

[[plugin]]
name = "yamllint"
mode = "comment"

[[plugin]]
name = "markdownlint"
mode = "comment"

[[plugin]]
name = "shellcheck"
mode = "comment"
